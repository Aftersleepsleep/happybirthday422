<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生日快乐 李嘉慧</title>
    <style>
      /* 全局样式 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #f9d5e3 0%, #e6f7ff 100%);
        overflow: hidden;
        height: 100vh;
      }

      /* 背景音乐控制 */
      .music-control {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }

      .music-control audio {
        width: 200px;
        opacity: 0.7;
      }

      .music-control audio:hover {
        opacity: 1;
      }

      .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
        justify-content: center;
        align-items: center;
      }

      /* 第一个画面：登录弹窗 */
      #screen1 {
        display: flex;
        background-color: rgba(0, 0, 0, 0.7);
      }

      .login-container {
        background-color: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        text-align: center;
        width: 320px;
      }

      .name-display {
        color: #ff69b4;
        font-size: 28px;
        margin-bottom: 20px;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      }

      .password-input {
        width: 100%;
        padding: 12px;
        margin: 15px 0;
        border: 2px solid #ff69b4;
        border-radius: 5px;
        font-size: 16px;
      }

      .button-group {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.3s;
      }

      .confirm-btn {
        background-color: #ff69b4;
        color: white;
      }

      .confirm-btn:hover {
        background-color: #ff1493;
      }

      .cancel-btn {
        background-color: #ccc;
        color: #333;
      }

      .cancel-btn:hover {
        background-color: #aaa;
      }

      /* 第二个画面：气泡祝福 */
      #bubble-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(135deg, #f8e8ff 0%, #e6f7ff 100%);
      }

      .bubble {
        position: absolute;
        max-width: 200px;
        padding: 15px;
        border-radius: 20px;
        background: linear-gradient(135deg, #ff9ecc, #ffccff);
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        animation: float 3s ease-in-out infinite;
        opacity: 0;
        transform: scale(0);
        transition:
          opacity 0.5s,
          transform 0.5s;
        z-index: 10;
      }

      .bubble.show {
        opacity: 1;
        transform: scale(1);
      }

      .bubble::after {
        content: "";
        position: absolute;
        bottom: -10px;
        left: 30px;
        width: 0;
        height: 0;
        border: 10px solid transparent;
        border-top-color: #ff9ecc;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-10px) rotate(2deg);
        }
      }

      /* 第三个画面：粒子效果 */
      #particle-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, #000 0%, #1a1a2e 100%);
      }

      .birthday-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 100;
        color: white;
      }

      .name-text {
        font-size: 48px;
        margin-bottom: 20px;
        color: #ff69b4;
        text-shadow: 0 0 10px #ff1493;
      }

      .birthday-wish {
        font-size: 36px;
        color: #ffcc00;
        text-shadow: 0 0 10px #ff9900;
      }

      /* Hello Kitty元素 */
      .kitty-element {
        position: absolute;
        font-size: 24px;
        opacity: 0.7;
        z-index: 5;
      }

      /* 引导动画覆盖层 */
      .music-guide {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        cursor: pointer;
      }

      .guide-content {
        text-align: center;
        color: white;
        animation: pulse 2s infinite;
      }

      .guide-text {
        font-size: 24px;
        margin-bottom: 20px;
      }

      .guide-button {
        padding: 15px 30px;
        background-color: #ff69b4;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .guide-button:hover {
        background-color: #ff1493;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <!-- 引导动画覆盖层 -->
    <div id="music-guide" class="music-guide">
      <div class="guide-content">
        <div class="guide-text">点击开始播放背景音乐</div>
        <button class="guide-button" onclick="startMusic()">开始</button>
      </div>
    </div>
    <!-- 第一个画面：登录弹窗 -->
    <div id="screen1" class="screen">
      <div class="login-container">
        <div class="name-display">李嘉慧</div>
        <div class="name-display">祝你生日快乐！</div>
      </div>
    </div>

    <!-- 第二个画面：气泡祝福 -->
    <div id="screen2" class="screen">
      <div id="bubble-container"></div>
    </div>

    <!-- 第三个画面：粒子效果 -->
    <div id="screen3" class="screen">
      <canvas id="particle-canvas"></canvas>
      <div class="birthday-text">
        <div class="name-text">李嘉慧</div>
        <div class="birthday-wish">Happy Birthday</div>
      </div>
    </div>

    <!-- 背景音乐 -->
    <div class="music-control">
      <audio
        id="background-music"
        src="/happybirthday422/music/birthday.mp3"
        loop
        controls
      >
        您的浏览器不支持音频播放
      </audio>
    </div>

    <script>
      // 页面加载时直接显示祝福画面
      window.onload = function () {
        document.getElementById("screen1").style.display = "none";
        document.getElementById("screen2").style.display = "block";
        startBubbles();
      };

      // 开始播放音乐
      function startMusic() {
        const audio = document.getElementById("background-music");
        audio.play().catch(function (error) {
          console.log("播放失败:", error);
        });
        // 隐藏引导覆盖层
        document.getElementById("music-guide").style.display = "none";
      }

      // 第二个画面：气泡祝福 [3,9](@ref)
      function startBubbles() {
        const container = document.getElementById("bubble-container");
        const messages = [
          "祝李嘉慧生日快乐！",
          "李嘉慧，愿你天天开心！",
          "生日快乐，李嘉慧！",
          "李嘉慧，祝你心想事成！",
          "Happy Birthday 李嘉慧！",
          "李嘉慧，愿幸福常伴你左右！",
          "生日快乐，可爱的李嘉慧！",
          "李嘉慧，祝你健康快乐！",
          "愿李嘉慧的每一天都充满阳光！",
          "李嘉慧，生日快乐，永远美丽！",
          "李嘉慧，愿你的梦想都实现！",
          "生日快乐，最棒的李嘉慧！",
          "李嘉慧，祝你笑口常开！",
          "李嘉慧，愿快乐永驻你心！",
          "生日快乐，亲爱的李嘉慧！",
          "李嘉慧，祝你学业进步！",
          "李嘉慧，愿好运常伴你！",
          "生日快乐，独一无二的李嘉慧！",
          "李嘉慧，祝你天天好心情！",
          "李嘉慧，愿你的世界充满色彩！",
          "生日快乐，善良的李嘉慧！",
          "李嘉慧，祝你友谊长存！",
          "李嘉慧，愿你的生活甜蜜蜜！",
          "生日快乐，聪明的李嘉慧！",
          "李嘉慧，祝你事业有成！",
          "李嘉慧，愿你的未来更精彩！",
          "生日快乐，勇敢的李嘉慧！",
          "李嘉慧，祝你家庭幸福！",
          "李嘉慧，愿你的每一天都美好！",
          "生日快乐，最爱的李嘉慧！",
        ];

        let index = 0;
        const usedPositions = [];

        function createBubble() {
          if (index >= messages.length) {
            // 所有气泡显示完成后，延迟3秒切换到第三个画面
            setTimeout(() => {
              document.getElementById("screen2").style.display = "none";
              document.getElementById("screen3").style.display = "block";
              startParticles();
            }, 3000);
            return;
          }

          const bubble = document.createElement("div");
          bubble.className = "bubble";
          bubble.textContent = messages[index];

          // 随机位置，但避免重叠 [3](@ref)
          let x, y;
          let positionValid = false;
          let attempts = 0;

          while (!positionValid && attempts < 50) {
            x = Math.random() * (window.innerWidth - 220);
            y = Math.random() * (window.innerHeight - 100);

            positionValid = true;
            for (const pos of usedPositions) {
              const distance = Math.sqrt(
                Math.pow(pos.x - x, 2) + Math.pow(pos.y - y, 2),
              );
              if (distance < 150) {
                // 最小间距
                positionValid = false;
                break;
              }
            }
            attempts++;
          }

          usedPositions.push({ x, y });
          bubble.style.left = `${x}px`;
          bubble.style.top = `${y}px`;

          // 随机延迟和动画持续时间
          const delay = Math.random() * 1000;
          const duration = 2 + Math.random() * 2;
          bubble.style.animationDelay = `${delay}ms`;
          bubble.style.animationDuration = `${duration}s`;

          container.appendChild(bubble);

          // 使用setTimeout实现渐显效果
          setTimeout(() => {
            bubble.classList.add("show");
          }, 100);

          index++;

          // 下一个气泡的延迟（200-500ms之间的随机值）
          const nextDelay = 200 + Math.random() * 300;
          setTimeout(createBubble, nextDelay);
        }

        // 开始创建气泡
        createBubble();
      }

      // 第三个画面：粒子效果
      function startParticles() {
        const canvas = document.getElementById("particle-canvas");
        const ctx = canvas.getContext("2d");
        const textElement = document.querySelector(".birthday-text");

        // 设置画布尺寸
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 粒子系统
        const particles = [];
        const particleCount = 200;

        // 创建粒子
        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 3 + 1,
            speedX: (Math.random() - 0.5) * 2,
            speedY: (Math.random() - 0.5) * 2,
            color: `hsl(${Math.random() * 360}, 70%, 60%)`,
          });
        }

        // 动画循环
        function animate() {
          ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // 聚焦效果 - 粒子向文本中心移动
          const centerX = canvas.width / 2;
          const centerY = canvas.height / 2;

          particles.forEach((particle) => {
            // 计算粒子到中心的距离
            const dx = centerX - particle.x;
            const dy = centerY - particle.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // 粒子向中心移动
            if (distance > 100) {
              particle.x += dx * 0.01;
              particle.y += dy * 0.01;
            } else {
              // 在中心附近随机移动
              particle.x += particle.speedX;
              particle.y += particle.speedY;

              // 边界检查
              if (particle.x < 0 || particle.x > canvas.width)
                particle.speedX *= -1;
              if (particle.y < 0 || particle.y > canvas.height)
                particle.speedY *= -1;
            }

            // 绘制粒子
            ctx.beginPath();
            ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
            ctx.fillStyle = particle.color;
            ctx.fill();
          });

          requestAnimationFrame(animate);
        }

        // 开始动画
        animate();

        // 添加Hello Kitty装饰元素
        addKittyElements();
      }

      // 添加Hello Kitty装饰元素
      function addKittyElements() {
        const container = document.getElementById("screen3");
        const kittySymbols = ["🎀", "🎁", "🌸", "🐱", "❤️", "🌟", "✨"];

        for (let i = 0; i < 15; i++) {
          const kitty = document.createElement("div");
          kitty.className = "kitty-element";
          kitty.textContent =
            kittySymbols[Math.floor(Math.random() * kittySymbols.length)];

          kitty.style.left = `${Math.random() * 100}%`;
          kitty.style.top = `${Math.random() * 100}%`;
          kitty.style.fontSize = `${20 + Math.random() * 30}px`;
          kitty.style.animation = `float ${3 + Math.random() * 5}s infinite ease-in-out`;

          container.appendChild(kitty);
        }
      }

      // 窗口大小调整时重新设置画布尺寸
      window.addEventListener("resize", function () {
        const canvas = document.getElementById("particle-canvas");
        if (canvas) {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
      });
    </script>
  </body>
</html>
